# daily-report 설정 템플릿.
#
# 권장: ~/.config/atlassian/daily-report.toml 에 두세요 — 플러그인이 갱신되어도
# 이 경로는 유지됩니다. 플러그인 디렉토리 옆 config.toml 도 동작하지만 갱신 시
# 유실됩니다. $DAILY_REPORT_CONFIG 환경변수로 경로를 명시할 수도 있습니다.
#
# `config.toml` 은 gitignore 대상이다 — 개인 값은 커밋되지 않는다.
#
# site·email·notify.slack_target 은 여기 적지 않아도 된다. 비워 두면
# ~/.config/atlassian/daily-track.env 에서 읽는다:
#
#   ATLASSIAN_SITE=your-site.atlassian.net
#   ATLASSIAN_EMAIL=you@example.com
#   ATLASSIAN_API_TOKEN=...
#   SLACK_BOT_TOKEN=xoxb-...
#   SLACK_TARGET=U0XXXXXXX          # DM 받을 사용자 ID 또는 채널 ID
#
# config.toml 에 적으면 그쪽이 우선한다.

# Obsidian vault 의 projects/ 루트. 필수.
vault = "~/path/to/vault/projects"

# site = "your-site.atlassian.net"   # 없으면 $ATLASSIAN_SITE (스킴은 벗겨진다)
# email = "you@example.com"          # 없으면 $ATLASSIAN_EMAIL

# 활성 폴링에서 빼되 parked 로 세는 상태들.
parked_statuses = ["Ready to Deploy"]

# QA 후보를 찾을 프로젝트 키와 조회 기간.
qa_projects = ["WPQ", "WV2Q"]
qa_lookback_days = 7

# 커밋 활동을 볼 로컬 저장소.
repos = [
  "~/path/to/repo-a",
  "~/path/to/repo-b",
]

[notify]
# "slack" | "osascript". 테이블 자체를 지우면 알림을 쓰지 않는다.
channel = "slack"
# slack_target = "U0XXXXXXX"        # 없으면 $SLACK_TARGET

[heartbeat]
# 이 시각을 넘겼는데 오늘 브리핑이 없으면 알린다 (평일만).
brief_deadline = "09:30"
# 주간 리포트를 기대하는 요일. 없으면 토요일.
# weekly_day = "sat"
# 브리핑 파일이 이 줄 수(빈 줄 제외) 미만이면 '부실'로 본다. 없으면 20.
# 파일만 있으면 정상으로 보던 판정을 없음/부실/미발송 3단계로 나눈 기준이다.
min_lines = 20
# 자기감시 알림(🔴)을 함께 보낼 2차 채널. Slack 봇 토큰이 만료돼도 경고가
# 조용히 사라지지 않게 겹쳐 보낸다. 빈 리스트([])면 2차 채널 없음.
# 일반 이벤트 알림은 여기 영향을 받지 않는다 — 매시 배너가 뜨면 안 된다.
fallback = ["osascript"]

[decisions]
# 브리핑 `### 결정` 의 `↳ 답:` 회신을 처리하는 규칙. 테이블을 지우면 기본값.
#
# 며칠치 브리핑을 훑을지. 어제 결정에 오늘 답할 수 있으므로 하루만 보면
# 금요일 항목에 월요일 달린 답을 놓친다. 없으면 7.
lookback_days = 7
# 새 답을 감지하면 `claude -p "/decision-apply --date <오늘>"` 를 백그라운드로
# 띄운다. false 면 감지·기록·Slack 접수 확인까지만 하고 스킬을 띄우지 않는다.
auto_apply = true
# 자동 처리 락(`daily/_apply.lock`)의 유효 시간(분). 이 시간 안에 쓰인 락이
# 있으면 새로 띄우지 않고, 넘긴 락은 죽은 것으로 보고 덮어쓴다. 만료가 없으면
# 자식이 죽으면서 남긴 락 하나가 자동 처리를 영구히 막는다. 없으면 30.
apply_lock_minutes = 30

[watch]
# 감시 규칙 W1~W10 의 임계값(일 단위). 테이블을 지우면 아래 기본값이 쓰인다.
# 값을 올리면 조용해지고, 내리면 시끄러워진다. 무시당하는 경보는 없는 것보다
# 나쁘므로, 자꾸 넘기게 되는 규칙은 끄지 말고 임계값을 올려라.
#
# 개별 티켓을 빼려면 임계값이 아니라 티켓 md frontmatter 에
# `watch_ignore: 사유` 를 적는다 — 그 티켓은 전 규칙에서 빠진다.
# ("방치"와 "의도적 대기"를 구분하는 장치. false/no/0/none 은 무시로 보지 않는다.)

# W2 배포일 임박 — prod 배포일이 며칠 앞으로 다가오면 알릴지.
deploy_soon_days = 3
# W1 등급 강하 — 배포일 경과가 며칠을 넘으면 🔴 에서 🟡 로 내릴지.
# 🔴 는 접히지 않으므로 만료가 없으면 오래 지난 릴리즈 하나가 매일 첫 줄을 먹는다.
# `비고` 에 `배포완료` 가 적힌 릴리즈는 경과일과 무관하게 바로 🟡 이다.
deploy_stale_days = 30
# W4 미처리 ⚠️ 방치 — 히스토리의 미처리 ⚠️ 가 며칠 지나면 알릴지(🟡).
attention_stale_days = 3
# W4 승격 — 며칠을 넘기면 🔴 로 올릴지.
attention_urgent_days = 7
# W5 문의 무응답 — `## 문의·Blocked` 에 미해결 문의가 있는데 Jira `updated` 가
# 며칠째 그대로인지. 비용 때문에 코멘트를 조회하지 않고 updated 를 프록시로 쓴다.
# parked(배포대기) 티켓은 제외한다 — 내 손을 떠난 것에 오늘 할 일이 없다.
# 문의 줄 끝에 `✅` 를 붙이면 해소로 본다. 전부 해소되면 W5 는 사라진다.
inquiry_silent_days = 3
# W6 blocked 장기화 — blocked 가 켜진 지 며칠 지났는지.
blocked_long_days = 7
# W7 티켓 정체 — 미완료 티켓의 updated 가 며칠째 그대로인지 (parked 제외).
ticket_stale_days = 14
# W8 배포대기 적체 — parked 티켓이 며칠째 그대로인지.
parked_stale_days = 30
# W9a PR 정체 — 내 열린 PR 이 며칠째 머물러 있으면 알릴지(🟡).
# PR 목록은 `repos` 의 로컬 저장소에서 origin 슬러그를 뽑아 `gh` 로 조회한다.
# 별도 설정 키가 없다 — 두 곳에 적으면 한쪽이 낡고, 낡은 쪽은 아무도 안 고친다.
pr_stale_days = 14
# W9 상한 — 며칠 넘은 PR 은 감시에서 **완전히 뺄지**. 등급 강하가 아니다.
# 400일 열려 있는 PR 은 사실상 진행 중단이고, 추적해도 오늘 할 일이 안 생긴다.
# 이 값을 넘긴 PR 은 충돌(W9b)이어도 나오지 않는다.
pr_abandon_days = 100
# W10 QA 시작 임박 — QA 시작일이 며칠 앞으로 다가왔는데 미완료 티켓이 남았으면
# 알릴지(🔴). QA 시작일이 이미 지났으면 W3 가 맡는다 — 두 규칙은 상호배타다.
# parked(배포대기)는 개발이 끝난 상태이므로 미완료로 세지 않는다.
qa_soon_days = 5
