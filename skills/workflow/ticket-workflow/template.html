<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{JIRA_KEY}} — {{TITLE}}</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #FAFBFC; --surf: #FFFFFF; --text: #24292F;
  --muted:#57606A; --acc:  #0969DA; --acc-t:#DDF4FF;
  --bdr:  #D0D7DE; --code: #F6F8FA;
  --grid: rgba(9,105,218,.06);
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0D1117; --surf:#161B22; --text:#E6EDF3; --muted:#7D8590;
  --acc:#58A6FF; --acc-t:#1c2d4f; --bdr:#30363D; --code:#161B22;
  --grid:rgba(88,166,255,.05);
}}
:root[data-theme="dark"]  { --bg:#0D1117; --surf:#161B22; --text:#E6EDF3; --muted:#7D8590; --acc:#58A6FF; --acc-t:#1c2d4f; --bdr:#30363D; --code:#161B22; --grid:rgba(88,166,255,.05); }
:root[data-theme="light"] { --bg:#FAFBFC; --surf:#FFFFFF; --text:#24292F; --muted:#57606A; --acc:#0969DA; --acc-t:#DDF4FF; --bdr:#D0D7DE; --code:#F6F8FA; --grid:rgba(9,105,218,.06); }

body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px,transparent 1px),
                    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size: 28px 28px;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.6;
  min-height: 100vh;
}

.plan {
  max-width: 740px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Header */
.hdr {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-top: 4px solid var(--acc);
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 0 0 6px 6px;
}
.key {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--acc); background: var(--acc-t);
  display: inline-block; padding: 2px 8px; border-radius: 3px; margin-bottom: 8px;
  font-family: 'SF Mono', Consolas, monospace;
}
.ttl {
  font-size: 20px; font-weight: 700; line-height: 1.3;
  margin-bottom: 14px; text-wrap: balance;
}
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 2px 8px;
  background: var(--code); border: 1px solid var(--bdr);
  color: var(--muted); border-radius: 4px; font-weight: 500;
}

/* Sections */
.sec {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  margin-bottom: 14px;
  overflow: hidden;
}
.slbl {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 7px 14px; border-bottom: 1px solid var(--bdr);
  font-family: 'SF Mono', Consolas, monospace;
}
.sbdy { padding: 16px; }

/* Steps */
.steps { list-style: none; counter-reset: s; }
.steps li {
  counter-increment: s;
  display: flex; gap: 12px; padding: 9px 0;
  border-bottom: 1px solid var(--bdr);
  font-size: 13px; align-items: flex-start;
}
.steps li:last-child { border-bottom: none; }
.steps li::before {
  content: counter(s, decimal-leading-zero);
  font-size: 11px; font-weight: 700; color: var(--acc);
  flex-shrink: 0; margin-top: 1px;
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
  font-family: 'SF Mono', Consolas, monospace;
}

/* Files */
.files { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.files li {
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 12px; color: var(--acc);
  padding: 5px 10px; background: var(--code);
  border-left: 3px solid var(--acc);
  border-radius: 0 4px 4px 0;
}

/* Tradeoffs */
.troff { padding: 9px 0; border-bottom: 1px solid var(--bdr); }
.troff:last-child { border-bottom: none; }
.tr-main { font-size: 13px; }
.tr-why { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Checklist */
.checks { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
.checks li::before { content: '□'; color: var(--acc); font-size: 15px; flex-shrink: 0; line-height: 1.4; }

p { font-size: 13px; }
</style>
</head>
<body>
<div class="plan">

  <div class="hdr">
    <span class="key">{{JIRA_KEY}}</span>
    <div class="ttl">{{TITLE}}</div>
    <div class="meta">
      <span class="tag">{{FIX_VERSION}}</span>
      <span class="tag">{{TYPE}}</span>
      <span class="tag">{{DATE}}</span>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">목표</div>
    <div class="sbdy">
      <p>{{GOAL}}</p>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">구현 단계</div>
    <div class="sbdy">
      <ol class="steps">
        {{STEPS}}
        <!-- 각 단계: <li>단계 내용</li> -->
      </ol>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">수정 파일</div>
    <div class="sbdy">
      <ul class="files">
        {{FILES}}
        <!-- 각 파일: <li>path/to/file.ts</li> -->
      </ul>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">트레이드오프</div>
    <div class="sbdy">
      {{TRADEOFFS}}
      <!--
      각 항목:
      <div class="troff">
        <div class="tr-main">선택 내용</div>
        <div class="tr-why">이유</div>
      </div>
      -->
    </div>
  </div>

  <div class="sec">
    <div class="slbl">완료 기준</div>
    <div class="sbdy">
      <ul class="checks">
        {{CHECKLIST}}
        <!-- 각 항목: <li>완료 조건</li> -->
      </ul>
    </div>
  </div>

</div>
</body>
</html>
