<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{JIRA_KEY}} — PR #{{PR_NUMBER}} 리뷰</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:   #FAFBFC; --surf: #FFFFFF; --text: #24292F;
  --muted:#57606A; --acc:  #0969DA; --acc-t:#DDF4FF;
  --bdr:  #D0D7DE; --code: #F6F8FA;
  --grid: rgba(9,105,218,.06);
  --must: #CF222E; --must-t: #FFEBE9;
  --should: #9A6700; --should-t: #FFF8C5;
  --nit: #57606A; --nit-t: #F6F8FA;
  --ok: #1A7F37; --ok-t: #DAFBE1;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0D1117; --surf:#161B22; --text:#E6EDF3; --muted:#7D8590;
  --acc:#58A6FF; --acc-t:#1c2d4f; --bdr:#30363D; --code:#161B22;
  --grid:rgba(88,166,255,.05);
  --must:#FF7B72; --must-t:#3d1a1a;
  --should:#E3B341; --should-t:#2d2208;
  --nit:#7D8590; --nit-t:#1c2128;
  --ok:#3FB950; --ok-t:#12261e;
}}
:root[data-theme="dark"]  { --bg:#0D1117; --surf:#161B22; --text:#E6EDF3; --muted:#7D8590; --acc:#58A6FF; --acc-t:#1c2d4f; --bdr:#30363D; --code:#161B22; --grid:rgba(88,166,255,.05); --must:#FF7B72; --must-t:#3d1a1a; --should:#E3B341; --should-t:#2d2208; --nit:#7D8590; --nit-t:#1c2128; --ok:#3FB950; --ok-t:#12261e; }
:root[data-theme="light"] { --bg:#FAFBFC; --surf:#FFFFFF; --text:#24292F; --muted:#57606A; --acc:#0969DA; --acc-t:#DDF4FF; --bdr:#D0D7DE; --code:#F6F8FA; --grid:rgba(9,105,218,.06); --must:#CF222E; --must-t:#FFEBE9; --should:#9A6700; --should-t:#FFF8C5; --nit:#57606A; --nit-t:#F6F8FA; --ok:#1A7F37; --ok-t:#DAFBE1; }

body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px,transparent 1px),
                    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size: 28px 28px;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.6;
  min-height: 100vh;
}

.review {
  max-width: 740px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Header */
.hdr {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-top: 4px solid var(--acc);
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 0 0 6px 6px;
}
.key {
  font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--acc); background: var(--acc-t);
  display: inline-block; padding: 2px 8px; border-radius: 3px; margin-bottom: 8px;
  font-family: 'SF Mono', Consolas, monospace;
}
.ttl {
  font-size: 20px; font-weight: 700; line-height: 1.3;
  margin-bottom: 14px; text-wrap: balance;
}
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag {
  font-size: 11px; padding: 2px 8px;
  background: var(--code); border: 1px solid var(--bdr);
  color: var(--muted); border-radius: 4px; font-weight: 500;
}
.pr-link {
  font-size: 11px; padding: 2px 8px;
  background: var(--acc-t); border: 1px solid var(--acc);
  color: var(--acc); border-radius: 4px; font-weight: 600;
  text-decoration: none; font-family: 'SF Mono', Consolas, monospace;
}
.pr-link:hover { text-decoration: underline; }

/* Sections */
.sec {
  background: var(--surf);
  border: 1px solid var(--bdr);
  border-radius: 6px;
  margin-bottom: 14px;
  overflow: hidden;
}
.slbl {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); padding: 7px 14px; border-bottom: 1px solid var(--bdr);
  font-family: 'SF Mono', Consolas, monospace;
}
.sbdy { padding: 16px; }

/* Issues */
.issue-group { margin-bottom: 14px; }
.issue-group:last-child { margin-bottom: 0; }
.severity {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 3px; margin-bottom: 8px;
}
.severity.must   { color: var(--must);   background: var(--must-t); }
.severity.should { color: var(--should); background: var(--should-t); }
.severity.nit    { color: var(--nit);    background: var(--nit-t); }

.issue-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.issue-list li {
  font-size: 13px; padding: 8px 12px;
  border-left: 3px solid var(--bdr);
  background: var(--code); border-radius: 0 4px 4px 0;
}
.issue-list.must   li { border-left-color: var(--must); }
.issue-list.should li { border-left-color: var(--should); }
.issue-list.nit    li { border-left-color: var(--nit); }

/* Mapping */
.map-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.map-item {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--bdr);
}
.map-item:last-child { border-bottom: none; }
.map-check { flex-shrink: 0; font-size: 15px; line-height: 1.4; }
.map-check.done   { color: var(--ok); }
.map-check.undone { color: var(--muted); }

/* Suggestions */
.sugg-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.sugg-list li {
  font-size: 13px; padding: 8px 12px;
  border-left: 3px solid var(--acc);
  background: var(--acc-t); border-radius: 0 4px 4px 0;
}

/* Next actions */
.next-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.next-list li { display: flex; gap: 10px; font-size: 13px; align-items: flex-start; }
.next-list li::before { content: '→'; color: var(--acc); flex-shrink: 0; }

p { font-size: 13px; }
</style>
</head>
<body>
<div class="review">

  <div class="hdr">
    <span class="key">{{JIRA_KEY}}</span>
    <div class="ttl">PR #{{PR_NUMBER}} 리뷰</div>
    <div class="meta">
      <a class="pr-link" href="{{PR_URL}}" target="_blank">#{{PR_NUMBER}}</a>
      <span class="tag">{{DATE}}</span>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">요약</div>
    <div class="sbdy">
      <p>{{SUMMARY}}</p>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">Plan 대비 매핑</div>
    <div class="sbdy">
      <ul class="map-list">
        {{MAPPING}}
        <!--
        각 항목:
        <li class="map-item">
          <span class="map-check done">☑</span>
          <span>체크리스트/Plan 항목 ↔ 커밋·파일</span>
        </li>
        또는
        <li class="map-item">
          <span class="map-check undone">☐</span>
          <span>미이행 항목</span>
        </li>
        -->
      </ul>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">이슈</div>
    <div class="sbdy">
      <div class="issue-group">
        <div class="severity must">Must fix</div>
        <ul class="issue-list must">
          {{ISSUES_MUST}}
          <!-- <li>이슈 내용</li> -->
        </ul>
      </div>
      <div class="issue-group">
        <div class="severity should">Should fix</div>
        <ul class="issue-list should">
          {{ISSUES_SHOULD}}
        </ul>
      </div>
      <div class="issue-group">
        <div class="severity nit">Nit / 질문</div>
        <ul class="issue-list nit">
          {{ISSUES_NIT}}
        </ul>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">제안 (선택)</div>
    <div class="sbdy">
      <ul class="sugg-list">
        {{SUGGESTIONS}}
        <!-- <li>제안 내용</li> -->
      </ul>
    </div>
  </div>

  <div class="sec">
    <div class="slbl">다음 액션</div>
    <div class="sbdy">
      <ul class="next-list">
        {{NEXT_ACTIONS}}
        <!-- <li>액션 내용</li> -->
      </ul>
    </div>
  </div>

</div>
</body>
</html>
